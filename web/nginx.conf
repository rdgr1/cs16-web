map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno do Docker; variavel evita falhar no boot se o orquestrador ainda nao subiu.
  resolver 127.0.0.11 valid=10s;
  set $orchestrator http://orchestrator:3000;

  # Necessarios para WASM com threads (SharedArrayBuffer).
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Embedder-Policy require-corp always;

  location /api/ {
    proxy_pass $orchestrator;
    proxy_set_header Host $host;
  }

  # WebSocket -> UDP (o orquestrador converte para a sala)
  location /ws/ {
    proxy_pass $orchestrator;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Arquivos do jogo (volume somente leitura) para o cliente WASM
  location /game/ {
    alias /srv/assets/;
    autoindex off;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
