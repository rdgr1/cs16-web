name: cs16-web

# Subir:  docker compose up --build
# Abrir:  http://localhost:8080
services:
  # Valida ./assets e o expoe (somente leitura) para as salas. Falha com mensagem clara se faltar algo.
  assets:
    image: alpine:3.20
    container_name: cs16-assets
    volumes:
      - ./assets:/assets:ro
      - ./scripts/validate-assets.sh:/validate.sh:ro
    environment:
      ROOM_MAPS: ${ROOM_MAPS:-fy_pool_day,fy_snow}
    command: ["sh", "-c", "sh /validate.sh && touch /tmp/ok && exec sleep infinity"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ok"]
      interval: 2s
      retries: 15
    restart: "no"

  # So constroi a imagem do servidor (ReHLDS + ReGameDLL); as salas usam essa imagem.
  server-image:
    build: ./server
    image: cs16-server
    entrypoint: ["true"]
    restart: "no"

  orchestrator:
    build: ./orchestrator
    container_name: cs16-orchestrator
    depends_on:
      assets:
        condition: service_healthy
      server-image:
        condition: service_completed_successfully
    environment:
      NETWORK_NAME: cs16-web_default
      ASSETS_CONTAINER: cs16-assets
      SERVER_IMAGE: cs16-server
      ROOM_MAPS: ${ROOM_MAPS:-fy_pool_day,fy_snow}
      MAX_ROOMS: ${MAX_ROOMS:-5}
      MAX_PLAYERS_CAP: ${MAX_PLAYERS_CAP:-16}
      IDLE_MINUTES: ${IDLE_MINUTES:-10}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    container_name: cs16-web
    depends_on:
      - orchestrator
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/public:/usr/share/nginx/html:ro
      # arquivos do jogo para o cliente WASM carregar (somente leitura)
      - ./assets:/srv/assets:ro
    restart: unless-stopped

  # docker compose --profile tools run --rm check
  check:
    profiles: ["tools"]
    image: alpine:3.20
    depends_on:
      - web
    environment:
      BASE_URL: http://web
    volumes:
      - ./scripts/check.sh:/check.sh:ro
    command: ["sh", "-c", "apk add --no-cache bash curl >/dev/null && bash /check.sh"]
